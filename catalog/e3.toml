[environment]
id = "e3"
name = "音声生成"
required_inputs = ["text", "audio"]
required_outputs = ["text", "audio"]

[[configurations]]
id = "e3-standard"
label = "標準"
status = "candidate"
chat_component = "chat"

[configurations.components.chat]
role = "chat"
engine = "llama"
model = "gemma-4-E4B-it"
source = { hub = "huggingface", repo = "ggml-org/gemma-4-E4B-it-GGUF", files = ["*.gguf"], revision = "", sha256 = {} }   # TODO(P0)
format = "gguf"
quantization = "none"
precision = { publisher = "BF16", runtime = "BF16", kv_cache = "f16" }
license = "Gemma"
size_gb = 16
mem = { weights_gb = 15, overhead_gb = 3 }
context = { max = 32768, default = 16384 }
capabilities = ["text", "tool_calls", "audio"]
args = ["--jinja"]

[configurations.components.tts]
role = "tts"
engine = "tts"
# 2026-10-31 の調査で選定：日本語・3 秒の参照音声で声をまねる・Apache-2.0。次点は openbmb/VoxCPM2（Apache-2.0）
# 声をまねるのは自分の声か許可を得た声だけにする
model = "Qwen3-TTS-12Hz-1.7B-Base"
source = { hub = "huggingface", repo = "Qwen/Qwen3-TTS-12Hz-1.7B-Base", files = [], revision = "", sha256 = {} }   # TODO(P0): Windows on Arm で動く実行方法（qwen-tts）を確認
format = "engine-specific"
quantization = "none"
precision = { publisher = "BF16", runtime = "BF16" }
license = "Apache-2.0"
size_gb = 8
mem = { weights_gb = 6, overhead_gb = 4 }
capabilities = ["speech_generate", "voice_reference"]

[configurations.components.voice_design]
role = "tts"
engine = "tts"
# 2026-11-20 追加：説明文から声を作る（決まった声の一覧＝下の voices を作るためだけに使う）。Apache-2.0
# 声はここで一度だけ作って成果物に保存し、以後は上の Base がその声をまねて読み上げる（同じ声で揃う）
model = "Qwen3-TTS-12Hz-1.7B-VoiceDesign"
source = { hub = "huggingface", repo = "Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign", files = [], revision = "", sha256 = {} }   # TODO(P0): Base と同じ中継で動くか確認
format = "engine-specific"
quantization = "none"
precision = { publisher = "BF16", runtime = "BF16" }
license = "Apache-2.0"
size_gb = 5
mem = { weights_gb = 4, overhead_gb = 2 }
capabilities = ["voice_design"]

# 決まった声の一覧（日本語・男女）。generate_speech の voice で名前を指定する。
# description は VoiceDesign への声の説明（英語のほうが安定する）。seed と合わせて同じ声が作られる。
# 実機で聞いて気に入らなければ description か seed を変える（変えると次の読み上げで作り直す）  # P0
