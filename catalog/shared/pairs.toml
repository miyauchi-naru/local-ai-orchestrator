# 組み合わせ評価（lao p0 pairs）の課題と候補。
# 会話モデルが日本語の依頼から lao のツールで生成モデルを使い、狙いどおりの絵・動画にできるかを測る。
# checks は「はい」が合格になるように書く（判定役が画像を見て はい／いいえ で答える）。
# 候補は「環境.構成.部品」で書く。組み合わせは chat × image × video（video が空なら chat × image）。
# 組み合わせが増えるほど時間がかかる（1 枚 30〜60 秒として、課題 20 件 × 最大 4 枚 × 組み合わせ数）。

[settings]
# 出来た画像を見せて直させる回数の上限（画像を見られない会話モデルは 0 回）
fix_rounds = 2
# 同じ課題を乱数を変えて何回やるか（ばらつきを見るなら 2 以上）
repeats = 1
seed = 1234
# 品質が最上位からこの点数以内なら、メモリが少ない組み合わせを推す
tie_points = 3
# 予算のうち、他のため（例：E3 の読み上げや小さい会話モデルを残す）に空けておきたい量
reserve_gb = 0
# 品質の重み（初回の再現度・引数の選び方・見て直す力・修正指示・動画）
weights = { first = 0.35, args = 0.15, fix = 0.2, edit = 0.2, video = 0.1 }

[candidates]
chat = [
  "e2.e2-standard.chat",       # Gemma 4 26B-A4B
  "e1.e1-omni.omni",           # Qwen3-Omni-30B-A3B
  "e1.e1-lfm3-omni.omni",      # LFM3-Omni
  "e4.e4-ltx.chat",            # Gemma 4 E4B（小さい。メモリの比較用）
  "e1.e1-standard.reasoner",   # gpt-oss-120b（画像を見られないので「見て直す」は 0 になる）
  "e1.e1-lfm25.reasoner",      # LFM2.5-24B-A2B（ツール呼び出しが強い。画像は見られないので「見て直す」は 0）
]
image = ["e2.e2-standard.imagegen"]
# 動画の課題に使う生成モデル。空にすると動画の課題は飛ばす（組み合わせが video の数だけ増える）
video = ["e4.e4-ltx.videogen"]
# 判定役。all ならカタログで画像を見られるモデル全部が一つずつ判定し、判定役ごとの品質の中央値で順位を付ける
# （組み合わせ自身の会話モデルは、その組み合わせの判定から外す）。絞るなら "e1.e1-standard.perceiver,e1.e1-omni.omni" のように書く
judge = "all"

# ---------------------------------------------------------------- 初回の再現度＋見て直す力
[[tasks]]
id = "count-colors"
request = "白いテーブルの上に、赤いりんごが3個と青いマグカップが1個ある写真を作って"
checks = ["りんごがちょうど3個ある", "りんごが赤い", "マグカップがちょうど1個ある", "マグカップが青い", "テーブルが白い", "写真のような見た目である"]

[[tasks]]
id = "left-right"
request = "左に黒い犬、右に白い猫が座っている絵。背景は夕方の公園"
checks = ["犬が画像の左側にいる", "犬が黒い", "猫が画像の右側にいる", "猫が白い", "犬と猫が座っている", "背景が公園である", "夕方の光や空である"]

[[tasks]]
id = "sign-text"
request = "古い木造の駄菓子屋の店先。看板に「だがしや」とひらがなで大きく書いてある"
checks = ["木造の建物の店先である", "看板がある", "看板に「だがしや」と読める文字がある", "看板の文字に崩れや余計な文字がない"]

[[tasks]]
id = "negation"
request = "人が一人もいない、雨の夜の渋谷のスクランブル交差点。車も走っていない"
checks = ["交差点が写っている", "雨が降っている、または路面が濡れている", "夜である", "人が一人も写っていない", "車が一台も写っていない"]
expect = { negative = true }

[[tasks]]
id = "portrait-poster"
request = "縦長のポスター。宇宙服を着た柴犬が月面に立っていて、遠くに地球が見える"
checks = ["縦長の画像である", "犬が宇宙服を着ている", "犬が柴犬に見える", "月面のような地面に立っている", "地球が見える"]
expect = { orientation = "portrait" }

[[tasks]]
id = "wide-banner"
request = "横長のバナー画像。左半分に青空と富士山、右半分は何もない白い余白にして、あとで文字を入れられるようにしたい"
checks = ["横長の画像である", "富士山が画像の左側にある", "青空がある", "右半分が白い余白になっている", "文字が入っていない"]
expect = { orientation = "landscape", negative = true }

[[tasks]]
id = "style-ukiyoe"
request = "浮世絵の画風で、自転車に乗るロボット"
checks = ["浮世絵のような画風である", "ロボットが描かれている", "ロボットが自転車に乗っている", "写真のような見た目ではない"]

[[tasks]]
id = "attribute-binding"
request = "赤い帽子をかぶった男の子と、黄色い傘を持った女の子が並んで歩いている"
checks = ["男の子が赤い帽子をかぶっている", "女の子が黄色い傘を持っている", "男の子は傘を持っていない", "女の子は赤い帽子をかぶっていない", "二人が並んで歩いている"]

[[tasks]]
id = "food-detail"
request = "真上から撮った、ラーメンの丼。チャーシュー2枚、半分に切った味玉1個、海苔1枚、ネギ"
checks = ["真上から見下ろした構図である", "ラーメンの丼である", "チャーシューがちょうど2枚ある", "半分に切った卵が見える", "海苔がある", "ネギがある"]

[[tasks]]
id = "game-icon"
request = "ゲームのアイテムアイコン。青く光る結晶の剣が1本、背景は透明っぽい単色。文字は入れない"
checks = ["剣がちょうど1本ある", "剣が結晶のような見た目である", "剣が青く光っている", "背景が単色である", "文字が入っていない", "アイコンのように中央に収まっている"]
expect = { orientation = "square", negative = true }

[[tasks]]
id = "relation"
request = "本棚の一番上の段に猫が寝ていて、床にはボールが転がっている部屋"
checks = ["本棚がある", "猫が本棚の一番上の段にいる", "猫が寝ている", "床にボールがある", "部屋の中である"]

[[tasks]]
id = "multi-count"
request = "空に風船が5個。赤2個、青2個、黄色1個"
checks = ["風船がちょうど5個ある", "赤い風船がちょうど2個ある", "青い風船がちょうど2個ある", "黄色い風船がちょうど1個ある", "背景が空である"]

[[tasks]]
id = "batch"
request = "同じ構図で色違いを3枚：丸いクッションがソファの上に1個"
checks = ["ソファがある", "丸いクッションがちょうど1個ある", "クッションがソファの上にある"]
expect = { count = 3 }

# ---------------------------------------------------------------- 修正指示
[[tasks]]
id = "edit-color"
kind = "edit"
request = "赤い車が海沿いの道を走っている写真"
checks = ["車が写っている", "車が赤い", "海沿いの道である"]
followup = "車の色だけ青に変えて。ほかはそのまま"
followup_checks = ["車が青い", "車が赤くない", "海沿いの道である", "車の形や位置が修正前と大きく変わっていない"]

[[tasks]]
id = "edit-add"
kind = "edit"
request = "木の机の上にノートパソコンが1台ある写真"
checks = ["机が木製である", "ノートパソコンがちょうど1台ある"]
followup = "パソコンの右にコーヒーカップを1つ置いて"
followup_checks = ["コーヒーカップがちょうど1つある", "カップがパソコンの右側にある", "ノートパソコンがちょうど1台ある", "机が木製である"]

[[tasks]]
id = "edit-remove"
kind = "edit"
request = "砂浜に赤いビーチパラソルと、白いサーフボードが立てかけてある"
checks = ["砂浜である", "赤いビーチパラソルがある", "白いサーフボードがある"]
followup = "サーフボードを消して"
followup_checks = ["サーフボードが無い", "赤いビーチパラソルがある", "砂浜である"]

[[tasks]]
id = "edit-text"
kind = "edit"
request = "カフェの黒板メニュー。チョークで「本日のおすすめ」と書いてある"
checks = ["黒板である", "「本日のおすすめ」と読める文字がある"]
followup = "黒板の文字を「季節のタルト」に書き換えて"
followup_checks = ["「季節のタルト」と読める文字がある", "「本日のおすすめ」の文字が残っていない", "黒板である"]

# ---------------------------------------------------------------- パターン選び（その生成モデルにパターンがあるときだけ、正しく選べたかも採点する）
[[tasks]]
id = "pattern-upscale"
kind = "edit"
request = "夜の港町の風景画"
checks = ["港町である", "夜である"]
followup = "ポスターに使うので、この絵を 2 倍に大きくして細かいところもくっきりさせて。構図は変えないで"
followup_checks = ["港町である", "夜である", "細部がくっきりしている", "構図が修正前と変わっていない"]
expect = { pattern = "upscale-2x" }

[[tasks]]
id = "pattern-face"
kind = "edit"
request = "カフェで本を読んでいる女性の写真"
checks = ["女性がいる", "本を読んでいる", "カフェの中である"]
followup = "顔と手が少し崩れているので、そこだけ直して。ほかはそのまま"
followup_checks = ["顔が自然である", "手の指が自然である", "本を読んでいる", "カフェの中である"]
expect = { pattern = "fix-face-hands" }

# ---------------------------------------------------------------- 動画（video の部品がある組み合わせだけ）
[[tasks]]
id = "video-wave"
kind = "video"
request = "海辺に立つ灯台の画像を作って、それを元に5秒の動画にして。波が打ち寄せて、カメラはゆっくり右へ動く"
checks = ["灯台がある", "海辺である"]
video_checks = ["4 コマを通して灯台が写り続けている", "波が動いている、または変化している", "カメラが横に動いている（コマごとに景色が少しずつずれている）", "途中で別の場面に切り替わっていない"]

[[tasks]]
id = "video-character"
kind = "video"
request = "赤いマフラーの雪だるまの画像を作って、雪が降る中で雪だるまが手を振る3秒の動画にして"
checks = ["雪だるまがいる", "雪だるまが赤いマフラーをしている"]
video_checks = ["4 コマを通して同じ雪だるまが写っている", "赤いマフラーが最後まで残っている", "雪が降っている", "雪だるまの腕や手の位置がコマごとに変わっている"]
