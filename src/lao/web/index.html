<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ローカルAI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#f5f4ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1f1e1d" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #faf9f5; --side: #f3f1ea; --panel: #ffffff; --fg: #1f1e1d; --muted: #6f6c64; --faint: #9a968c;
  --line: #e6e2d8; --hover: #ebe8de; --accent: #c96442; --accent-fg: #fff; --user: #efece3; --warn: #b4441f;
  --ok: #3f7d4e; --ghost: #5b5a8a; --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  --fs: 15px;
}
:root[data-theme="dark"] {
  --bg: #262624; --side: #1f1e1d; --panel: #30302e; --fg: #ecebe6; --muted: #a9a69c; --faint: #7d7a72;
  --line: #3b3a37; --hover: #353432; --accent: #d97757; --user: #3a3936; --warn: #ef8a62; --ok: #7cc28a; --ghost: #a3a2e0;
  --shadow: 0 1px 2px rgba(0,0,0,.2), 0 4px 16px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #262624; --side: #1f1e1d; --panel: #30302e; --fg: #ecebe6; --muted: #a9a69c; --faint: #7d7a72;
    --line: #3b3a37; --hover: #353432; --accent: #d97757; --user: #3a3936; --warn: #ef8a62; --ok: #7cc28a; --ghost: #a3a2e0;
    --shadow: 0 1px 2px rgba(0,0,0,.2), 0 4px 16px rgba(0,0,0,.25);
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: var(--fs)/1.7 system-ui, -apple-system, "Segoe UI", "Yu Gothic UI", "Hiragino Sans", sans-serif; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; border-radius: 8px; padding: 6px 10px; }
button:hover { background: var(--hover); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, textarea:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
input[type=text], input[type=search], input[type=password], textarea.field, select.field {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); }
textarea.field { resize: vertical; min-height: 90px; font-size: 14px; }
.app { display: grid; grid-template-columns: 272px 1fr auto; height: 100vh; height: 100dvh; }
.app.side-hidden { grid-template-columns: 0 1fr auto; }
.muted { color: var(--muted); }
.small { font-size: 12px; }

/* サイドバー */
aside.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; overflow: hidden; }
.side-head { display: flex; align-items: center; gap: 4px; padding: 14px 12px 6px; }
.brand { font-weight: 650; flex: 1; display: flex; align-items: center; gap: 8px; }
.brand img { width: 22px; height: 22px; }
.newrow { display: flex; gap: 4px; margin: 4px 10px 6px; }
.newchat { flex: 1; display: flex; gap: 8px; align-items: center; padding: 8px 10px; border-radius: 10px; }
.newchat .plus { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font-size: 16px; line-height: 1; }
.side-nav { padding: 0 10px; }
.side-nav button { width: 100%; text-align: left; display: flex; gap: 10px; align-items: center; color: var(--muted); }
.side-nav button.on { color: var(--fg); background: var(--hover); }
.side-label { font-size: 12px; color: var(--faint); padding: 12px 20px 4px; }
.convs { flex: 1; overflow: auto; padding: 0 10px 12px; }
.conv { display: flex; align-items: center; gap: 6px; border-radius: 8px; padding: 5px 6px 5px 8px; cursor: pointer; }
.conv:hover, .conv.active { background: var(--hover); }
.conv .t { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 14px; }
.conv .more { visibility: hidden; padding: 0 6px; color: var(--muted); }
.conv:hover .more, .conv.active .more { visibility: visible; }
.badge { font-size: 11px; font-weight: 600; padding: 1px 6px; border-radius: 6px; background: var(--line); color: var(--muted); flex: none; }
.badge.ghost { background: transparent; color: var(--ghost); border: 1px solid var(--ghost); }
.side-foot { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 12px; color: var(--muted); }
.meter { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-top: 6px; }
.meter > div { height: 100%; background: var(--accent); width: 0; transition: width .4s; }

/* 中央 */
main { display: flex; flex-direction: column; min-width: 0; height: 100vh; height: 100dvh; }
.top { display: flex; align-items: center; gap: 8px; padding: 10px 16px; min-height: 52px; }
.top .title { font-weight: 600; flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; cursor: text; min-width: 0; }
.top .title input { font-weight: 600; width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 2px 8px; background: var(--panel); }
.status-chip { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.ctx { font-size: 12px; color: var(--faint); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.dot.busy { background: var(--accent); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .35; } }
.scroll { flex: 1; overflow: auto; }
.thread { max-width: 780px; margin: 0 auto; padding: 8px 20px 40px; }
.page { max-width: 820px; margin: 0 auto; padding: 8px 24px 60px; }
.page h1 { font-size: 24px; font-weight: 550; margin: 8px 0 4px; font-family: ui-serif, Georgia, "Yu Mincho", serif; }
.page h2 { font-size: 16px; margin: 26px 0 8px; }
.page .lead { color: var(--muted); margin: 0 0 16px; }
.turn { margin: 18px 0; position: relative; }
.turn.user { display: flex; flex-direction: column; align-items: flex-end; }
.bubble { background: var(--user); border-radius: 14px; padding: 10px 14px; max-width: 85%; white-space: pre-wrap; word-break: break-word; }
.cmdtag { font-size: 12px; color: var(--accent); margin-bottom: 2px; }
.att-row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; margin-bottom: 6px; }
.tools { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; font-size: 12px; color: var(--muted); margin-top: 2px; }
.turn:hover .tools, .turn:focus-within .tools, .turn.last .tools { opacity: 1; }
.tools button { padding: 3px 8px; color: var(--muted); }
.assistant .body { word-break: break-word; }
.assistant .body p { margin: 0 0 .8em; }
.assistant .body code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .92em; }
.assistant .body :not(pre) > code { background: var(--hover); padding: 1px 5px; border-radius: 5px; }
.assistant .body ul, .assistant .body ol { padding-left: 1.4em; margin: 0 0 .8em; }
.assistant .body h1, .assistant .body h2, .assistant .body h3 { font-size: 1.05em; margin: 1em 0 .4em; }
.assistant .body a { color: var(--accent); }
.assistant .body table { border-collapse: collapse; margin: 0 0 .8em; font-size: 14px; display: block; overflow-x: auto; }
.assistant .body th, .assistant .body td { border: 1px solid var(--line); padding: 4px 8px; }
.assistant .body blockquote { border-left: 3px solid var(--line); margin: 0 0 .8em; padding-left: 12px; color: var(--muted); }
.codeblock { border: 1px solid var(--line); border-radius: 10px; margin: 0 0 .9em; overflow: hidden; background: var(--panel); }
.codehead { display: flex; align-items: center; gap: 4px; padding: 2px 6px 2px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); background: var(--side); }
.codehead .lang { flex: 1; }
.codehead button { padding: 2px 8px; font-size: 12px; }
.codeblock pre { margin: 0; padding: 10px 12px; overflow: auto; font-size: 13px; max-height: 420px; }
.artline { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 .9em; background: var(--panel); cursor: pointer; box-shadow: var(--shadow); text-align: left; width: 100%; }
.artline:hover { border-color: var(--accent); background: var(--panel); }
.artline .ico { width: 36px; height: 36px; border-radius: 8px; background: var(--hover); display: grid; place-items: center; font-size: 12px; font-weight: 700; color: var(--muted); flex: none; }
.artline b { display: block; font-size: 14px; }
.steps { font-size: 13px; color: var(--muted); border-left: 2px solid var(--line); padding: 2px 0 2px 12px; margin: 0 0 10px; }
.action { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--accent); border-radius: 12px; padding: 10px 12px; margin: 0 0 10px; background: var(--panel); }
.action .main { flex: 1; min-width: 0; } .action .main b { display: block; overflow-wrap: anywhere; } .action .d { display: block; font-size: 13px; color: var(--muted); }
.action.done, .action.rejected, .action.failed { border-color: var(--line); }
.action pre { white-space: pre-wrap; font-size: 12px; max-height: 200px; overflow: auto; }
.newbadge { background: var(--accent); color: #fff; border-radius: 9px; font-size: 11px; padding: 0 6px; margin-left: 6px; }
.steps > div { white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
.steps summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 6px; }
.steps summary::-webkit-details-marker { display: none; }
.thinking { white-space: pre-wrap; font-size: 13px; color: var(--muted); max-height: 260px; overflow: auto; margin-top: 4px; }
.spin { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.err { color: var(--warn); font-weight: 600; margin: 6px 0; }
.cards { display: flex; flex-wrap: wrap; gap: 10px; margin: 8px 0 10px; }
.cards:empty { display: none; }
.card { width: 220px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); cursor: pointer; text-align: left; padding: 0; box-shadow: var(--shadow); }
.card:hover { border-color: var(--accent); background: var(--panel); }
.card .thumb { height: 140px; background: var(--hover); display: grid; place-items: center; overflow: hidden; color: var(--muted); font-size: 13px; }
.card .thumb img, .card .thumb video { width: 100%; height: 100%; object-fit: cover; }
.card .cap { padding: 8px 10px; font-size: 12px; }
.card .cap b { display: block; font-size: 13px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 3px 6px 3px 3px; }
.chip img { width: 28px; height: 28px; object-fit: cover; border-radius: 5px; }
.chip .k { width: 28px; height: 28px; border-radius: 5px; background: var(--hover); display: grid; place-items: center; font-size: 11px; }
.chip button { padding: 0 4px; }
.speed { font-size: 11px; color: var(--faint); margin-left: 6px; }

/* 入力欄 */
.composer-wrap { padding: 0 20px 16px; position: relative; }
.composer { max-width: 780px; margin: 0 auto; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 10px 12px 8px; position: relative; }
.composer.ghost { border-color: var(--ghost); }
.composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; min-height: 28px; max-height: 240px; padding: 4px 4px; }
.composer .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.composer .chips:empty { display: none; }
.composer .row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
.composer .grow { flex: 1; }
.pick { border: 1px solid var(--line); border-radius: 10px; padding: 3px 6px; background: transparent; font-size: 13px; max-width: 250px; }
.send { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; padding: 0; font-size: 18px; }
.send:hover { background: var(--accent); filter: brightness(1.05); }
.rec { color: var(--warn); }
.voice { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 24px; text-align: center; }
.vorb { width: 140px; height: 140px; border-radius: 50%; background: var(--accent); opacity: .85; transition: transform .1s linear; }
.voice[data-s="think"] .vorb { animation: vpulse 1.2s ease-in-out infinite; opacity: .5; }
.voice[data-s="speak"] .vorb { animation: vpulse .6s ease-in-out infinite; }
@keyframes vpulse { 50% { transform: scale(1.12); } }
.vstate { font-size: 20px; }
.vtext { max-width: 640px; max-height: 30vh; overflow: auto; color: var(--muted); white-space: pre-wrap; }
.hint { max-width: 780px; margin: 6px auto 0; font-size: 12px; color: var(--faint); text-align: center; }
.popup { position: absolute; left: 12px; right: 12px; bottom: calc(100% + 6px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); max-height: 280px; overflow: auto; z-index: 4; padding: 4px; }
.popup button { width: 100%; text-align: left; display: block; padding: 6px 10px; }
.popup button.sel { background: var(--hover); }
.popup .d { font-size: 12px; color: var(--muted); }
.menu { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); z-index: 30; padding: 4px; min-width: 200px; }
.menu button { width: 100%; text-align: left; display: block; padding: 7px 12px; font-size: 14px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

/* 空の画面 */
.empty { max-width: 780px; margin: 10vh auto 0; padding: 0 20px; text-align: center; }
.empty h1 { font-weight: 500; font-size: 30px; margin: 0 0 6px; font-family: ui-serif, Georgia, "Yu Mincho", serif; }
.empty p { color: var(--muted); margin: 0 0 24px; }
.empty.ghost h1 { color: var(--ghost); }
.envgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; text-align: left; }
.envcard { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--panel); cursor: pointer; }
.envcard:hover, .envcard.on { border-color: var(--accent); }
.envcard b { display: block; }
.envcard span { font-size: 13px; color: var(--muted); }
.envcard .note { font-size: 12px; color: var(--warn); }

/* 一覧・編集ページ */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 8px 0 16px; overflow-x: auto; }
.tabs button { border-radius: 8px 8px 0 0; color: var(--muted); }
.tabs button.on { color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
.list { display: grid; gap: 8px; }
.item { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--panel); display: flex; gap: 10px; align-items: flex-start; }
.item .main { flex: 1; min-width: 0; }
.item .main b { display: block; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--panel); }
.stat b { display: block; font-size: 24px; }
.stat span { font-size: 12px; color: var(--muted); }
.bars { display: flex; align-items: flex-end; gap: 3px; height: 110px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.bars div { flex: 1; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 1px; opacity: .85; }
.barlbl { display: flex; gap: 3px; font-size: 11px; color: var(--faint); }
.barlbl span { flex: 1; text-align: center; }
.nudge { max-width: 780px; margin: 0 auto 8px; border: 1px solid var(--line); background: var(--panel); border-radius: 12px; padding: 8px 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 14px; }
.nudge .grow { flex: 1; }
.item .main .d { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.form { display: grid; gap: 10px; }
.form label { font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.toggle { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.projcard { border: 1px solid var(--line); border-radius: 14px; padding: 14px; background: var(--panel); cursor: pointer; text-align: left; }
.projcard:hover { border-color: var(--accent); background: var(--panel); }
.projcard b { display: block; margin-bottom: 4px; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: 12px; background: var(--panel); }

/* 右パネル */
.panel { width: 0; overflow: hidden; border-left: 1px solid var(--line); background: var(--panel); transition: width .2s; display: flex; flex-direction: column; }
.panel.open { width: min(560px, 46vw); }
.panel-head { display: flex; align-items: center; gap: 6px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.panel-head b { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.panel-body { flex: 1; overflow: auto; padding: 14px; display: flex; flex-direction: column; }
.preview img, .preview video { width: 100%; border-radius: 10px; background: var(--hover); }
.preview audio { width: 100%; }
.preview pre { white-space: pre-wrap; font-size: 13px; }
.aibar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 8px 10px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; }
[hidden] { display: none !important; }
.preview iframe { width: 100%; border: 1px solid var(--line); border-radius: 10px; background: #fff; flex: 1; min-height: 420px; }
.preview .doc { font-size: 15px; }
.editor { width: 100%; flex: 1; min-height: 360px; font: 13px/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); resize: vertical; }
.vers { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.vers button, .seg button { border: 1px solid var(--line); font-size: 12px; }
.vers button.on, .seg button.on { border-color: var(--accent); color: var(--accent); }
.seg { display: inline-flex; gap: 4px; }
dl.meta { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; margin: 12px 0; }
dl.meta dt { color: var(--muted); }
dl.meta dd { margin: 0; word-break: break-word; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); color: var(--fg); text-decoration: none; display: inline-block; }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.danger { color: var(--warn); }
.libgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.libgrid .card { width: auto; }
.filters { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.filters button { border: 1px solid var(--line); font-size: 12px; }
.filters button.on { border-color: var(--accent); color: var(--accent); }
.fixbar { display: none; position: fixed; z-index: 25; }

/* ダイアログ */
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; place-items: center; z-index: 10; padding: 16px; }
.modal.show { display: grid; }
.dialog { background: var(--panel); border-radius: 16px; padding: 20px; width: min(520px, 100%); box-shadow: var(--shadow); max-height: 86vh; overflow: auto; }
.dialog h2 { margin: 0 0 8px; font-size: 17px; }
.dialog p { color: var(--muted); margin: 0 0 14px; font-size: 14px; }
.dialog .actions { justify-content: flex-end; margin-top: 14px; }
.search-res { display: grid; gap: 2px; margin-top: 10px; max-height: 50vh; overflow: auto; }
.search-res button { text-align: left; display: block; width: 100%; }
.search-res .d { font-size: 12px; color: var(--muted); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 40; }
.toast.show { opacity: 1; }
.menu-btn { display: none; }

@media (max-width: 860px) {
  .app, .app.side-hidden { grid-template-columns: 1fr; }
  aside.side { position: fixed; inset: 0 auto 0 0; width: 280px; z-index: 5; transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  .app.side-open aside.side { transform: none; }
  .menu-btn { display: inline-block; }
  .panel.open { position: fixed; inset: 0; width: 100%; z-index: 6; }
  .envgrid, .grid2 { grid-template-columns: 1fr; }
  .thread, .page, .composer-wrap { padding-left: 16px; padding-right: 16px; }
  .ctx { display: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="brand"><img src="/icon.svg" alt="">ローカルAI</div>
      <button id="searchBtn" title="会話を検索（Ctrl+K）" aria-label="会話を検索">⌕</button>
      <button id="hideSide" title="サイドバーを閉じる" aria-label="サイドバーを閉じる">⟨</button>
    </div>
    <div class="newrow">
      <button class="newchat" id="newChat" title="新しい会話（Ctrl+Shift+O）"><span class="plus">+</span>新しい会話</button>

  // UMD 版の lucide-react などは小文字の window.react を見る
  const alias = `<script>window.react = window.React; window["react-dom"] = window.ReactDOM;<\/script>`;
  return `<!doctype html><meta charset="utf-8"><body style="margin:0;background:#fff">${order.filter((x) => libs.has(x)).map((x, i) => vsrc(x) + (i === 1 ? alias : "")).join("")}${vsrc("tailwind.js")}${vsrc("babel.js")}
<div id="root"></div><script>
try {
  var out = Babel.transform(${src}, { presets: ${ts ? '[["typescript", { isTSX: true, allExtensions: true }], "react"]' : '["react"]'}, filename: "App.${ts ? "tsx" : "jsx"}" }).code;
  var s = document.createElement("script"); s.textContent = out + "\\n;window.__laoReady && window.__laoReady();";
  window.__laoReady = function () { if (!window.__laoApp) throw new Error("export default の部品がありません");
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(window.__laoApp)); };
  document.body.appendChild(s);
} catch (e) { parent.postMessage({ laoArtifactError: String(e && e.message || e) }, "*"); }
<\/script>`;
}
function previewDoc(lang, code) {

}

/* 成果物から AI への問い合わせ（window.claude.complete）。表示中の成果物から、利用者が許可したときだけ */
let aiGate = { spec: null, waiting: [] };
addEventListener("message", (e) => {
  const req = e.data && e.data.laoComplete; if (!req) return;
  const fr = $("panelBody").querySelector("iframe");
  if (!fr || e.source !== fr.contentWindow || !aiGate.spec) return;
  const reply = (r) => { try { e.source.postMessage({ laoCompleteResult: { id: req.id, ...r } }, "*"); } catch (_) {} };
  const run = async () => {
    const p = req.prompt; const body = Array.isArray(p) ? { messages: p } : { prompt: String(p ?? "") };
    $("aiUse").hidden = false;
    try { reply({ text: (await getJSON("/api/complete", { method: "POST", json: body })).text }); }
    catch (err) { reply({ error: err.message }); }
    finally { $("aiUse").hidden = true; }
  };
  if (aiGate.spec.ai === "yes") return run();
  if (aiGate.spec.ai === "no") return reply({ error: "利用者が AI の利用を許可しませんでした" });
  aiGate.waiting.push(run, reply); $("aiAsk").hidden = false;
});
function aiDecide(ok) {
  aiGate.spec.ai = ok ? "yes" : "no"; $("aiAsk").hidden = true;
  const w = aiGate.waiting; aiGate.waiting = [];
  for (let i = 0; i < w.length; i += 2) ok ? w[i]() : w[i + 1]({ error: "利用者が AI の利用を許可しませんでした" });
}

    let body = "";

    } else body = `<textarea class="editor" id="codeEdit" spellcheck="false">${esc(spec.code)}</textarea>`;
    $("panelBody").innerHTML = body + `<div class="actions" style="margin-top:10px">
      <button class="btn" id="pCopy">コピー</button>
      <button class="btn" id="pSave">${spec.ref ? "変更を新しい版で保存" : "ライブラリに保存"}</button>

      ${spec.ref ? `<p class="small muted">保存先：${esc(spec.ref)}（保存すると新しい版になります）</p>` : ""}`;
    const current = () => ($("codeEdit") ? $("codeEdit").value : spec.code);
    $("pCopy").onclick = () => copyText(current());
    $("pDl").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([current()], { type: "text/plain" })); a.download = (spec.title || "artifact").replace(/[\\/:*?"<>|]/g, "_") + (EXT[lang] || ".txt"); a.click(); };
    $("pSave").onclick = async () => {
      spec.code = current();
      try {
        const a = await getJSON("/api/library/text", { method: "POST", json: { text: spec.code, ext: EXT[lang] || ".txt", title: $("panelTitle").textContent, parent: spec.ref || null } });
        artCache.set(a.ref, a); spec.ref = a.ref; toast(`保存しました（${a.ref}）`); render();
      } catch (e) { toast(e.message); }
    };
    $("fixErr").onclick = () => { setInput(`右に表示した ${$("panelTitle").textContent} で次のエラーが出ます。直した全体を出してください。\n\nエラー：${artifactError}`); };

async function openArtifact(ref) {
  const a = await art(ref); if (!a) return;
  const vers = (await getJSON(`/api/library/${ref.split("@")[0]}/versions`)).items;
  vers.forEach((v) => artCache.set(v.ref, v));
  if (a.kind === "text") {
    const ext = a.filename.split(".").pop().toLowerCase();
    if (["html", "svg", "md", "txt", "py", "js", "ts", "css", "json", "csv", "ps1", "sh", "sql", "yaml", "toml", "xml", "jsx", "tsx", "mmd"].includes(ext)) {
      const code = await (await api(`/files/${a.ref}`)).text();
      await openCode({ lang: ext, code, title: a.title, ref: a.ref });
      if (vers.length > 1) $("panelBody").insertAdjacentHTML("beforeend", versHTML(vers, a.ref));
      return;
    }
  }
  if (a.kind === "image" && a.mime === "image/svg+xml") {
    await openCode({ lang: "svg", code: await (await api(`/files/${a.ref}`)).text(), title: a.title, ref: a.ref }); return;
  }
  $("panelTitle").textContent = a.title; $("panelTools").innerHTML = "";
  let preview = "";
  if (a.kind === "image") preview = `<img src="${fileUrl(a.ref)}" alt="">`;
  else if (a.kind === "video") preview = `<video src="${fileUrl(a.ref)}" controls></video>`;
  else if (a.kind === "audio") preview = `<audio src="${fileUrl(a.ref)}" controls></audio>`;
  else if (/\.pdf$/i.test(a.filename)) {
    const r = await getJSON(`/api/preview/${a.ref}`).catch(() => null);
    preview = `<iframe src="${fileUrl(a.ref)}" title="PDF"></iframe>${r ? `<details><summary class="muted">文字で見る</summary><pre>${esc(r.text)}</pre></details>` : ""}`;
  }
  else if (/\.(docx|xlsx|pptx)$/i.test(a.filename)) {
    const r = await getJSON(`/api/preview/${a.ref}`).catch(() => null);
    preview = r ? `<p class="muted">中身の文字だけを表示しています。見た目は「保存」して Office で開いて確かめてください。</p><pre>${esc(r.text)}</pre>`
      : `<p class="muted">中身を読めませんでした。</p>`;
  }
  else preview = `<p class="muted">この形式（${esc(a.mime)}）は画面に表示できません。会話に添付すると AI が中身を読みます。</p>`;
  const g = a.generation || {};
  const rows = [["種類", KIND[a.kind]], ["環境", a.env.toUpperCase()], ["ID", a.ref], ["作成", new Date(a.created_at * 1000).toLocaleString("ja-JP")],
    ["モデル", g.model], ["プロンプト", g.prompt || g.instruction || g.question], ["シード", g.seed],
    ["長さ", g.actual_seconds != null ? `${g.actual_seconds} 秒（指定 ${g.requested_seconds} 秒）` : null],
    ["音声", g.has_audio == null ? null : g.has_audio ? "あり" : "なし"], ["元素材", (a.sources || []).join(", ")]].filter((r) => r[1] != null && r[1] !== "");
  $("panelBody").innerHTML = `<div class="preview">${preview}</div>${versHTML(vers, a.ref)}
    <dl class="meta">${rows.map((r) => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join("")}</dl>
    <div class="actions"><button class="btn primary" data-use="${a.ref}">この版を添付</button><a class="btn" href="${fileUrl(a.ref)}" download>保存</a>
    ${state.projectId || (state.conv && state.conv.project_id) ? `<button class="btn" data-addknow="${a.ref}">プロジェクトの資料に追加</button>` : ""}</div>`;
  $("panel").classList.add("open");
}

async function switchEnv(value, { confirmFirst = true } = {}) {

async function fillCards(el, refs) { const box = el.querySelector(".cards"); box.innerHTML = (await Promise.all(refs.map((r) => cardHTML(r)))).join(""); }

/* ---------- 送信 ---------- */
function setInput(text) { showView("chat"); $("input").value = text; autosize(); $("input").focus(); }
async function ensureConv() {
  if (state.conv && `${state.conv.env_id}|${state.conv.configuration}` === activeKey()) return true;
  const c = await getJSON("/api/conversations", { method: "POST", json: { project_id: state.projectId, incognito: state.ghost } });
  state.conv = { ...c, turns: [] }; return true;
}
async function send(opts = {}) {
  // opts: { regenerate, editTurn, text }

  const text = (opts.text ?? $("input").value).trim();
  if (!opts.regenerate && !text) return;
  if (!activeKey()) { toast("先に環境を選んでください"); return; }
  if (!opts.regenerate && opts.editTurn == null) await ensureConv();
  const c = state.conv;
  const refs = opts.regenerate ? [] : opts.editTurn != null ? (c.turns[opts.editTurn].attachments || []) : (opts.attachments || state.attachments.slice());
  if (opts.regenerate) { while (c.turns.length && c.turns[c.turns.length - 1].role === "assistant") c.turns.pop(); }
  else if (opts.editTurn != null) { c.turns = c.turns.slice(0, opts.editTurn); }
  if (!opts.regenerate) {
    c.turns.push({ role: "user", content: text, attachments: refs });
    if (opts.text == null) { $("input").value = ""; autosize(); }
    if (!opts.attachments) { state.attachments = []; renderChips(); }
  }
  await renderThread();
  const live = { role: "assistant", content: "", thinking: "", progress: [], artifacts: [], error: "" };
  const el = document.createElement("div"); el.className = "turn assistant last"; el.innerHTML = assistantHTML(live, true);
  $("thread").appendChild(el); scrollDown(true);
  setRunning(true);
  const ctrl = new AbortController(); state.abort = ctrl;
  const t0 = performance.now(); let firstTok = 0;
  const body = opts.regenerate ? { regenerate: true } : { text, attachments: refs, ...(opts.editTurn != null ? { edit_turn: opts.editTurn } : {}) };
  body.effort = $("effortPick").hidden ? "" : $("effortPick").value;
  if (opts.voice) body.voice = true;
  noteActivity();
  let pending = false, ended = false;
  const paint = () => { if (pending) return; pending = true; requestAnimationFrame(() => { pending = false; if (ended) return; const cards = el.querySelector(".cards").innerHTML; el.innerHTML = assistantHTML(live, true); el.querySelector(".cards").innerHTML = cards; scrollDown(); }); };
  try {
    const r = await api(`/api/conversations/${c.id}/messages`, { method: "POST", json: body, signal: ctrl.signal });
    const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = "";
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, i); buf = buf.slice(i + 1); if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.type === "progress") { live.progress.push(ev.text); if (ev.data && ev.data.job) state.jobId = ev.data.job; }
        else if (ev.type === "text") { if (!firstTok) firstTok = performance.now(); live.content += ev.text; }
        else if (ev.type === "thinking") live.thinking += ev.text;
        else if (ev.type === "artifacts") { live.artifacts.push(...ev.data.refs); ev.data.refs.forEach((x) => artCache.delete(x)); await fillCards(el, live.artifacts); }
        else if (ev.type === "error") live.error = ev.text;
        else if (ev.type === "action") (live.actions = live.actions || []).push(ev.data);
        else if (ev.type === "usage") { state.lastUsage = ev.data; showUsage(); }
        else if (ev.type === "done") c.title = ev.title;
        paint();
      }
    }
  } catch (e) { live.error = e.name === "AbortError" ? "途中で止めました" : e.message; }
  if (firstTok && live.content) { const sec = (performance.now() - firstTok) / 1000; live.speed = `${Math.round(live.content.length / Math.max(sec, 0.1))} 文字/秒`; }
  ended = true; c.turns.push(live);
  el.innerHTML = assistantHTML(live, false) + assistantTools(live); el.dataset.idx = c.turns.length - 1; await fillCards(el, live.artifacts);
  $("title").textContent = c.title; markLast();
  setRunning(false); loadConvs(); refreshStatus();
  if (opts.voice) return live;
  if (document.hidden && store("lao-notify") === "1" && "Notification" in window && Notification.permission === "granted") {
    new Notification("ローカルAI：返答ができました", { body: (live.error || live.content).slice(0, 80), icon: "/icon.svg" });
  }
}
function showUsage() {
  const u = state.lastUsage; if (!u) { $("ctx").textContent = ""; return; }
  $("ctx").textContent = `文脈 ${u.prompt_tokens.toLocaleString()} / ${u.context.toLocaleString()}`;
  $("ctx").title = "いまの会話が使っている文脈の量（トークン）。上限が近づくと前半を自動で要約します。";
}
function setRunning(on) {

  const b = $("send"); b.textContent = on ? "■" : "↑"; b.title = on ? "停止（Esc）" : "送信（Enter）"; b.setAttribute("aria-label", b.title);

/* ---------- 返答・発言の操作 ---------- */
async function turnAction(act, el) {
  const idx = +el.dataset.idx; const c = state.conv; const t = c && c.turns[idx]; if (!t) return;
  if (act === "copy") return copyText(t.content);
  if (act === "retry") { if (state.running) return; return send({ regenerate: true }); }
  if (act === "branch") {
    const n = await getJSON(`/api/conversations/${c.id}/branch`, { method: "POST", json: { upto: idx } });
    toast("分岐した会話を作りました"); return openConv(n.id);
  }
  if (act === "edit") {
    const v = await promptBox("発言を編集して送り直す", t.content, "送り直す", true);
    if (v == null || !v.trim()) return;
    if (idx < c.turns.length - 1 && !(await confirmBox("この後の会話は書き直されます", "この発言より後のやり取りは消え、新しい返答に置き換わります。残したい場合は先に「ここから分岐」してください。", "送り直す"))) return;
    return send({ editTurn: idx, text: v.trim() });
  }
  if (act === "speak") {
    try { toast("読み上げ音声を作っています…"); new Audio(fileUrl(await speechFor(t.content))).play(); }
    catch (e) { toast(e.message); }
  }
}
function speakable(text) {
  return text.replace(/```[\s\S]*?```/g, "").replace(/https?:\/\/\S+/g, "").replace(/^\s*[|#>*-]+\s*/gm, "").replace(/[*`_|]/g, "").trim().slice(0, 10000);
}
async function speechFor(text, isStopped = () => false) {
  // E3 の読み上げで音声を作り、成果物の ref を返す
  const { job } = await getJSON("/api/speak", { method: "POST", json: { text: speakable(text) } });
  for (let i = 0; i < 1200; i++) {
    await new Promise((r) => setTimeout(r, 500));
    if (isStopped()) { api(`/api/jobs/${job}/cancel`, { method: "POST" }).catch(() => {}); throw new Error("止めました"); }
    const j = await getJSON(`/api/jobs/${job}`);
    if (j.state === "done") return j.result[0];
    if (["failed", "cancelled", "interrupted"].includes(j.state)) throw new Error(j.error || "読み上げできませんでした");
  }
  throw new Error("読み上げに時間がかかりすぎました");
}

/* ---------- 音声会話（話す → 聞き取って答える → 読み上げる、を繰り返す。録音はこの PC の中だけで扱う） ---------- */
const voice = { on: false, stream: null, ctx: null, rec: null, audio: null, phase: "" };
const VOICE_PROMPT = "（音声で話しかけました。録音を聞いて答えてください）";
function voiceUI(phase, text) {
  voice.phase = phase; $("voice").dataset.s = phase;
  $("vState").textContent = { listen: "聞いています…", think: "考えています…", speak: "話しています…", idle: "一時停止中" }[phase] || "";
  $("vTap").textContent = { listen: "話し終わった", think: "止める", speak: "さえぎって話す", idle: "もう一度話す" }[phase] || "";
  if (text != null) $("vText").textContent = text;
  $("vOrb").style.transform = "";
}
async function startVoice() {
  if (!hasCap("audio")) { toast("この環境は音声を聞き取れません（E1 か E3 を選んでください）"); return; }
  if (state.running) { toast("返答が終わってから始めてください"); return; }
  try { voice.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
  catch (e) { toast("マイクを使えませんでした"); return; }
  voice.ctx = new AudioContext(); voice.on = true;
  $("voice").hidden = false; $("vText").textContent = "";
  $("vNote").textContent = hasCap("speech_generate") ? "返答は読み上げます。会話は普段どおり保存されます。"
    : "この環境には読み上げがないため、返答は文字で表示します（読み上げは E3 で使えます）。";
  listen();
}
function endVoice() {
  voice.on = false;
  if (voice.rec && voice.rec.state !== "inactive") { voice.rec.onstop = null; voice.rec.stop(); }
  if (voice.audio) voice.audio.pause();
  if (state.running) stop();
  if (voice.stream) voice.stream.getTracks().forEach((t) => t.stop());
  if (voice.ctx) voice.ctx.close().catch(() => {});
  Object.assign(voice, { stream: null, ctx: null, rec: null, audio: null });
  $("voice").hidden = true;
}
function listen() {
  if (!voice.on) return;
  voiceUI("listen");
  const an = voice.ctx.createAnalyser(); an.fftSize = 1024; voice.ctx.createMediaStreamSource(voice.stream).connect(an);
  const buf = new Float32Array(an.fftSize);
  const rec = new MediaRecorder(voice.stream); const chunks = []; voice.rec = rec;
  let floor = 0.01, loud = 0, spoke = false, quietSince = 0; const t0 = performance.now();
  rec.ondataavailable = (e) => chunks.push(e.data);
  const tick = () => {
    if (rec.state !== "recording") return;
    an.getFloatTimeDomainData(buf);
    const rms = Math.sqrt(buf.reduce((a, x) => a + x * x, 0) / buf.length); const now = performance.now();
    // 周りの音の大きさ：静かになるとすぐ下げ、うるさいときはゆっくり上げる
    floor = rms < floor ? (floor + rms) / 2 : floor * 0.995 + rms * 0.005;
    const th = Math.max(0.012, floor * 3);
    $("vOrb").style.transform = `scale(${1 + Math.min(rms * 6, 0.5)})`;
    loud = rms > th ? loud + 1 : 0;
    if (loud >= 3) { spoke = true; quietSince = 0; }  // 0.15 秒以上続いたら話し声とみなす（物音を拾わない）
    else if (rms > th && spoke) quietSince = 0;
    else if (spoke) { quietSince = quietSince || now; if (now - quietSince > 1300) return rec.stop(); }
    if (now - t0 > 60000) return rec.stop();  // 1 回は 60 秒まで
    setTimeout(tick, 50);
  };
  rec.onstop = async () => {
    voice.rec = null;
    if (!voice.on) return;
    if (!spoke && !rec.manual) return listen();  // 何も話されなかった
    const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
    voiceUI("think", "");
    let ref;
    try {
      const fd = new FormData(); fd.append("file", new File([blob], `音声_${new Date().toLocaleTimeString("ja-JP").replace(/:/g, "")}.webm`, { type: blob.type }));
      const a = await (await api("/api/upload", { method: "POST", body: fd })).json(); artCache.set(a.ref, a); ref = a.ref;
    } catch (e) { voiceUI("idle", `録音を送れませんでした：${e.message}`); return; }
    const live = await send({ text: VOICE_PROMPT, attachments: [ref], voice: true });
    if (!voice.on) return;
    if (!live || live.error) { voiceUI("idle", live ? live.error : "送れませんでした"); return; }
    const said = speakable(live.content);
    if (!hasCap("speech_generate") || !said) { voiceUI("idle", live.content); return; }
    voiceUI("think", live.content);
    try {
      const out = await speechFor(said, () => !voice.on || voice.phase !== "think");
      if (!voice.on) return;
      voiceUI("speak"); voice.audio = new Audio(fileUrl(out));
      voice.audio.onended = () => { voice.audio = null; listen(); };
      await voice.audio.play();
    } catch (e) { if (voice.on && voice.phase === "think") voiceUI("idle", `${live.content}\n\n（読み上げできませんでした：${e.message}）`); }
  };
  rec.start(250); tick();
}
function voiceTap() {
  if (voice.phase === "listen" && voice.rec) { voice.rec.manual = true; voice.rec.stop(); }
  else if (voice.phase === "think") { if (state.running) stop(); voiceUI("idle"); }
  else if (voice.phase === "speak") { if (voice.audio) { voice.audio.onended = null; voice.audio.pause(); voice.audio = null; } listen(); }
  else listen();
}

async function renderChips() { $("chips").innerHTML = (await Promise.all(state.attachments.map((r) => chipHTML(r, true)))).join(""); }
async function uploadFiles(files) {
  for (const f of files) {
    const fd = new FormData(); fd.append("file", f);
    try { const a = await (await api("/api/upload", { method: "POST", body: fd })).json(); artCache.set(a.ref, a); state.attachments.push(a.ref); }

async function captureScreen() {
  try {
    const stream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: false });
    const v = document.createElement("video"); v.srcObject = stream; v.muted = true; await v.play();
    await new Promise((r) => setTimeout(r, 300));
    const cv = document.createElement("canvas"); cv.width = v.videoWidth; cv.height = v.videoHeight; cv.getContext("2d").drawImage(v, 0, 0);
    stream.getTracks().forEach((t) => t.stop());
    const blob = await new Promise((r) => cv.toBlob(r, "image/png"));
    await uploadFiles([new File([blob], `画面_${new Date().toLocaleTimeString("ja-JP").replace(/:/g, "")}.png`, { type: "image/png" })]);
  } catch (e) { if (e.name !== "NotAllowedError") toast("画面を取り込めませんでした"); }
}

  if (state.recorder) { state.recorder.stop(); return; }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const rec = new MediaRecorder(stream); const chunks = [];
    rec.ondataavailable = (e) => chunks.push(e.data);
    rec.onstop = async () => {
      stream.getTracks().forEach((t) => t.stop()); state.recorder = null; $("mic").classList.remove("rec"); $("mic").textContent = "●";
      const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
      await uploadFiles([new File([blob], "録音.webm", { type: blob.type })]);
      if (!$("input").value.trim()) { $("input").value = "この録音を文字に起こして、内容に答えてください。"; autosize(); }
    };
    rec.start(); state.recorder = rec; $("mic").classList.add("rec"); $("mic").textContent = "■"; toast("録音中…もう一度押すと止めて添付します");
  } catch (e) { toast("マイクを使えませんでした"); }
}

async function saveSkillFromText(text) {
  const m = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
  if (!m) { toast("SKILL.md の形ではありません"); return; }
  const meta = {}; m[1].split("\n").forEach((l) => { const i = l.indexOf(":"); if (i > 0) meta[l.slice(0, i).trim()] = l.slice(i + 1).trim(); });
  itemEditor("skills", null);
  $("ieName").value = meta.name || ""; $("ieDesc").value = meta.description || ""; $("ieBody").value = m[2].trim();
}

/* ---------- AI の提案（フォルダへの書き込み・定期実行の登録） ---------- */
async function decideAction(aid, approve, turnEl) {
  if (!state.conv) return;
  try {
    const a = await getJSON(`/api/conversations/${state.conv.id}/actions/${aid}`, { method: "POST", json: { approve } });
    const t = state.conv.turns[+turnEl.dataset.idx];
    if (t) { t.actions = (t.actions || []).map((x) => (x.id === aid ? a : x)); turnEl.innerHTML = assistantHTML(t, false) + assistantTools(t); await fillCards(turnEl, t.artifacts || []); }
    toast(a.status === "done" ? "実行しました" : a.status === "rejected" ? "やめました" : `できませんでした：${a.result}`);
    if (a.kind === "schedule") pollTasks();
  } catch (e) { toast(e.message); }
}

async function taskAction(id, op) {
  const t = (state._tasks || []).find((x) => x.id === id); if (!t) return;
  if (op === "open") { await api(`/api/tasks/${id}`, { method: "PATCH", json: { unread: false } }); pollTasks(); return openConv(t.last_conversation); }
  if (op === "edit") return taskEditor(t);
  if (op === "del") { if (await confirmBox("作業を削除しますか？", t.name, "削除")) { await api(`/api/tasks/${id}`, { method: "DELETE" }); renderTasks(); } return; }
  if (op === "run") { toast("実行しています…"); try { const r = await getJSON(`/api/tasks/${id}/run`, { method: "POST" }); toast(r.last_status); } catch (e) { toast(e.message); } renderTasks(); pollTasks(); loadConvs(); }

let seenTaskRuns = null;
async function pollTasks() {
  let items; try { items = (await getJSON("/api/tasks")).items; } catch (e) { return; }
  const unread = items.filter((t) => t.unread).length;
  $("taskBadge").innerHTML = unread ? `<span class="newbadge">${unread}</span>` : "";
  const runs = Object.fromEntries(items.map((t) => [t.id, t.last_run]));
  if (seenTaskRuns) {
    for (const t of items) {
      if (t.last_run && t.last_run !== seenTaskRuns[t.id]) {
        toast(`定期実行「${t.name}」：${t.last_status}`); loadConvs();
        if (store("lao-notify") === "1" && "Notification" in window && Notification.permission === "granted") new Notification(`定期実行：${t.name}`, { body: t.last_status, icon: "/icon.svg" });
      }
    }
  }
  seenTaskRuns = runs;
}
setInterval(pollTasks, 60000);

  const months = [...Array(12)].map((_, i) => { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`; });
  month = month || months[0];
  let r; try { r = await getJSON(`/api/recap?month=${month}`); } catch (e) { $("page").innerHTML = `<h1>ふりかえり</h1><p>${esc(e.message)}</p>`; return; }

/* 休憩の声かけ：続けて使った時間を数え、設定の分数を超えたら一度だけすすめる */
function noteActivity() {
  const now = Date.now(), last = +store("lao-act-last") || 0;
  if (now - last > 15 * 60000) store("lao-act-start", String(now));
  store("lao-act-last", String(now));
  const mins = +((state.settings || {}).break_minutes ?? 90);
  const start = +store("lao-act-start") || now, nudged = +store("lao-act-nudged") || 0;
  const used = Math.round((now - start) / 60000);
  const h = new Date().getHours();
  if (mins && used >= mins && now - Math.max(nudged, start) >= mins * 60000) {
    showNudge(`続けて ${used >= 120 ? Math.floor(used / 60) + " 時間" : used + " 分"}ほど使っています。目を休めたり、体を伸ばしたりしませんか。`);
  } else if (mins && h < 5 && now - nudged > 30 * 60000 && store("lao-act-night") !== new Date().toDateString()) {
    store("lao-act-night", new Date().toDateString());
    showNudge("夜遅い時間です。続きは明日にして、休むのもよさそうです。");
  }
}
function showNudge(text) {
  store("lao-act-nudged", String(Date.now()));
  $("nudgeText").textContent = text; $("nudge").hidden = false;
}
$("nudgeLater").onclick = () => { $("nudge").hidden = true; };
$("nudgeRest").onclick = () => { $("nudge").hidden = true; store("lao-act-start", String(Date.now() + 5 * 60000)); toast("いってらっしゃい。会話はそのまま残っています"); };

  if (t.dataset.env) { if (await switchEnv(t.dataset.env)) newChat({ projectId: state.projectId, ghost: state.ghost }); return; }
  if (t.dataset.filter !== undefined) { state.libFilter = t.dataset.filter; return openLibrary(); }
  if (t.dataset.code) { const c = codeStore[+t.dataset.code]; return openCode({ lang: c.lang, code: c.code }); }
  if (t.dataset.copycode) return copyText(codeStore[+t.dataset.copycode].code);
  if (t.dataset.skillsave) return saveSkillFromText(codeStore[+t.dataset.skillsave].code.trim());
  if (t.dataset.act) return turnAction(t.dataset.act, t.closest(".turn"));
  if (t.dataset.view) { const v = t.dataset.view; if (v === "library") return openLibrary(); if (v === "projects") return renderProjects(); if (v === "customize") return renderCustomize(); if (v === "settings") return renderSettings(); if (v === "tasks") return renderTasks(); if (v === "recap") return renderRecap(); }
  if (t.dataset.proj) return renderProject(t.dataset.proj);
  if (t.dataset.ctab) return renderCustomize(t.dataset.ctab);
  if (t.dataset.newitem) return itemEditor(t.dataset.newitem, null);
  if (t.dataset.edititem) return itemEditor(t.dataset.edititem, state._items.find((x) => x.name === t.dataset.name));
  if (t.dataset.delitem) { if (await confirmBox("削除しますか？", t.dataset.name, "削除")) { await api(`/api/${t.dataset.delitem}/${encodeURIComponent(t.dataset.name)}`, { method: "DELETE" }); loadCommands(); renderCustomize(t.dataset.delitem); } return; }
  if (t.dataset.cmd) return pickCommand(t.dataset.cmd);
  if (t.dataset.delplug) { if (await confirmBox("プラグインを削除しますか？", t.dataset.delplug, "削除")) { await api(`/api/plugins/${t.dataset.delplug}`, { method: "DELETE" }); loadCommands(); renderCustomize("plugins"); } return; }
});
document.addEventListener("change", async (ev) => {
  const t = ev.target;
  if (t.dataset.skilltoggle) { const s = state._items.find((x) => x.name === t.dataset.skilltoggle); await api(`/api/skills/${encodeURIComponent(s.name)}`, { method: "PUT", json: { ...s, enabled: t.checked } }); toast(t.checked ? "オンにしました" : "オフにしました"); }
  if (t.dataset.tasktoggle) { await api(`/api/tasks/${t.dataset.tasktoggle}`, { method: "PATCH", json: { enabled: t.checked } }); renderTasks(); }
  if (t.dataset.plugtoggle) { await api(`/api/plugins/${t.dataset.plugtoggle}`, { method: "PATCH", json: { enabled: t.checked } }); loadCommands(); toast(t.checked ? "オンにしました" : "オフにしました"); }
});
$("envPick").onchange = async (e) => { if (await switchEnv(e.target.value)) newChat({ projectId: state.projectId, ghost: state.ghost }); };
$("stylePick").onchange = async (e) => { if (await saveSettings({ style: e.target.value })) toast("スタイルを変えました"); };
$("effortPick").onchange = async (e) => { await saveSettings({ effort: e.target.value }); };
$("newChat").onclick = () => newChat();
$("newGhost").onclick = () => newChat({ ghost: true });
$("searchBtn").onclick = openSearch;
$("closePanel").onclick = () => $("panel").classList.remove("open");
$("attach").onclick = (e) => { const r = e.currentTarget.getBoundingClientRect(); attachMenu(r.left, r.top - 170); };
$("mic").onclick = toggleRecord;
$("voiceBtn").onclick = startVoice; $("vTap").onclick = voiceTap; $("vEnd").onclick = endVoice;
$("file").onchange = async () => { await uploadFiles([...$("file").files]); $("file").value = ""; };
$("send").onclick = () => (state.running ? stop() : send());
$("title").onclick = () => { if (state.conv && state.view === "chat" && !state.conv.incognito) renameConv(state.conv.id, state.conv.title); };
$("input").addEventListener("input", () => { autosize(); state.popupSel = 0; updatePopup(); });
$("input").addEventListener("keydown", (e) => {
  if (!$("popup").hidden) {
    const btns = [...$("popup").querySelectorAll("button")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); state.popupSel = (state.popupSel + (e.key === "ArrowDown" ? 1 : btns.length - 1)) % btns.length; updatePopup(); return; }
    if ((e.key === "Enter" || e.key === "Tab") && !e.isComposing) { e.preventDefault(); pickCommand(btns[state.popupSel].dataset.cmd); return; }
    if (e.key === "Escape") { $("popup").hidden = true; return; }
  }
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if ((e.ctrlKey || e.metaKey) && k === "k") { e.preventDefault(); openSearch(); }
  else if ((e.ctrlKey || e.metaKey) && e.shiftKey && k === "o") { e.preventDefault(); newChat(); }
  else if ((e.ctrlKey || e.metaKey) && e.shiftKey && k === "s") { e.preventDefault(); $("app").classList.toggle("side-hidden"); $("showSide").hidden = !$("app").classList.contains("side-hidden"); }
  else if (e.key === "Escape" && voice.on) endVoice();
  else if (e.key === "Escape") { if ($("modal").classList.contains("show") && state.key) closeDialog(); else if (state.running) stop(); else $("menu").hidden = true; }
});
$("menuBtn").onclick = () => $("app").classList.toggle("side-open");
$("hideSide").onclick = () => { $("app").classList.add("side-hidden"); $("showSide").hidden = false; };
$("showSide").onclick = () => { $("app").classList.remove("side-hidden"); $("showSide").hidden = true; };
$("modal").onclick = (e) => { if (e.target === $("modal") && state.key) closeDialog(); };
const comp = $("composer");
comp.addEventListener("dragover", (e) => { e.preventDefault(); comp.style.borderColor = "var(--accent)"; });
comp.addEventListener("dragleave", () => (comp.style.borderColor = ""));
comp.addEventListener("drop", (e) => { e.preventDefault(); comp.style.borderColor = ""; uploadFiles([...e.dataTransfer.files]); });
document.addEventListener("paste", (e) => { if (state.view !== "chat") return; const fs = [...(e.clipboardData?.files || [])]; if (fs.length) uploadFiles(fs); });
addEventListener("beforeunload", (e) => { if (state.conv && state.conv.incognito && state.conv.turns.length) { e.preventDefault(); e.returnValue = ""; } });

async function boot() {
  await refreshStatus(); await Promise.all([loadConvs(), loadSettings(), loadCommands()]); renderThread(); pollTasks();
}
const qs = new URLSearchParams(location.search);
if (qs.get("key")) { store("lao-key", qs.get("key")); history.replaceState(null, "", "/"); }
state.key = store("lao-key") || "";
if (!state.key) askKey(); else boot();
setInterval(refreshStatus, 4000);
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>
</html>
